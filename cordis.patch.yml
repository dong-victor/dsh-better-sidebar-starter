# dsh-better-sidebar-starter bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add @dong-victor/dsh-better-sidebar-starter
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends the plugin to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like the manual cordis.patch.yml mount line used before.
- insert:
    - id: better-sidebar-starter
      name: '@dong-victor/dsh-better-sidebar-starter'
